<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: url('g/t1.jpg') no-repeat center center/cover;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }
        .text {
            font-size: 80px;
            font-weight: bold;
            color: black;
            margin-bottom: 10px;
        }
        .card {
            text-align: center;
            max-width: 1200px;
            padding: 10px;
        }
        .video-container {
            position: relative;
            width: 300px;
            height: 300px;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .flower {
            position: absolute;
            top: 0;
            font-size: 24px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
        .special-button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #ff69b4;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .special-button:hover {
            background-color: #ff1493;
        }
    </style>
</head>
<body>

    <div class="text">Yah Coklatnya udah Abis</div>    
    <div class="card">
        <div class="video-container">
            <video src="g/b3.mp4" autoplay loop muted playsinline></video>
        </div>
    </div>

    <!-- Tombol menuju spesial.html -->
    <button class="special-button" onclick="window.location.href='spesial.html'">Nih ada kado🎁</button>

    <script>
        function createFlower() {
            const flower = document.createElement("div");
            flower.classList.add("flower");
            flower.innerHTML = "😝";
            flower.style.left = Math.random() * 100 + "vw";
            flower.style.animationDuration = Math.random() * 10 + 2 + "s";
            document.body.appendChild(flower);
            setTimeout(() => {
                flower.remove();
            }, 20000);
        }
        setInterval(createFlower, 300);
    </script>

</body>
</html>
