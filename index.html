<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lily</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: url('g/t1.jpg') no-repeat center center/cover;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: black;
            clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 50% 80%, 20% 100%, 0% 35%);
            animation: float 5s linear infinite;
        }
        @keyframes float {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }
        .text {
            font-size: 80px;
            font-weight: bold;
            color: black;
            margin-bottom: 10px;
        }
        .buttons {
            gap: 30px;
        }
        .button {
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .yes-button {
            background-color: green;
            font-size: 40px;
            padding: 10px 20px;
        }
        .no-button {
            background-color: red;
            font-size: 40px;
            padding: 10px 20px;
        }
        .flower {
            position: absolute;
            top: 0;
            font-size: 24px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
        /* Container untuk GIF */
        .gif-container {
            margin-top: 20px;
        }
        iframe {
            border: none;
            width: 800px;
            height: 400px;
        }
    </style>
</head>
<body>
    <div class="text">Selamat Valentine Early</div>
    <div class="text">Mau coklat ga?</div>
    <div class="buttons">
        <button class="button yes-button" onclick="window.location.href='val2.html'">Mau</button>
        <button class="button no-button">Ga</button>
    </div>


    <script>
        function createFlower() {
            const flower = document.createElement("div");
            flower.classList.add("flower");
            flower.innerHTML = "🌷";
            flower.style.left = Math.random() * 100 + "vw";
            flower.style.animationDuration = Math.random() * 3 + 2 + "s";
            document.body.appendChild(flower);
            setTimeout(() => {
                flower.remove();
            }, 5000);
        }
        setInterval(createFlower, 300);
    </script>
</body>
</html>
